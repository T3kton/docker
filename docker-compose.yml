# Contractor demo: contractor, a subcontractor with no DHCP, and the databases.
# Meant for looking at the UI and playing with the API, NOT for real use, the
# passwords are the defaults.
#
#   docker-compose up -d
#   http://localhost:8080/     user: root  password: root (or $ROOT_PASSWORD)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contractor
      POSTGRES_PASSWORD: contractor
      POSTGRES_DB: contractor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  contractor:
    image: t3kton/contractor:latest
    build: .
    command: contractor
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root}
    ports:
      - "${CONTRACTOR_PORT:-8080}:80"
    volumes:
      - contractor_data:/var/lib/contractor
    depends_on:
      - postgres
      - mongo
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "-X", "DESCRIBE", "-H", "Cinp-Version: 2.0", "http://localhost/api/v1/" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  subcontractor:
    image: t3kton/contractor:latest
    command: subcontractor
    environment:
      CONTRACTOR_URL: http://contractor
      SUBCONTRACTOR_MODULES: manual,test,iputils
    depends_on:
      - contractor
    restart: unless-stopped

  # a one time job, adds some Test and Manual foundations and structures, see
  # load_demo_data, it exits when done
  demo-data:
    image: t3kton/contractor:latest
    command: load-demo-data
    environment:
      CONTRACTOR_URL: http://contractor
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root}
    depends_on:
      - contractor
    restart: "no"

  # ---- the kubernetes profile: docker-compose --profile kubernetes up -d ----
  # A control plane only k3s (API server and datastore, no nodes, so nothing can
  # run pods), the t3kton operator running next to it, and the Structure CRD.
  # The operator turns Structure resources into contractor jobs, see the README.
  k3s:
    image: rancher/k3s:latest
    profiles: [ kubernetes ]
    command: server --disable-agent --disable-cloud-controller --disable-network-policy --disable=traefik,servicelb,metrics-server,coredns,local-storage --write-kubeconfig-mode=644
    privileged: true
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - k3s_config:/etc/rancher/k3s
    restart: unless-stopped

  # installs the CRD, then exits
  k8s-setup:
    image: rancher/k3s:latest
    profiles: [ kubernetes ]
    network_mode: service:k3s
    entrypoint:
      - /bin/sh
      - -c
      - |
        until kubectl apply -f /crd; do sleep 3; done
        sed "s|CA_BUNDLE|$$(base64 /certs/tls.crt | tr -d '\n')|" /k8s-webhooks.yaml | kubectl apply -f -
    environment:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    volumes:
      - k3s_config:/etc/rancher/k3s:ro
      - k8s_certs:/certs:ro
      - ./src/kubernetes/config/crd/bases:/crd:ro
      - ./k8s-webhooks.yaml:/k8s-webhooks.yaml:ro
    depends_on:
      - k3s
      - k8s-certs
    restart: "no"

  # a self signed certificate for the operator's webhooks (instead of
  # cert-manager), then exits
  k8s-certs:
    image: alpine/openssl:latest
    profiles: [ kubernetes ]
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /certs/tls.crt ] || openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -subj /CN=t3kton-operator -addext subjectAltName=IP:127.0.0.1 \
          -keyout /certs/tls.key -out /certs/tls.crt
        chmod 644 /certs/tls.key
    volumes:
      - k8s_certs:/certs
    restart: "no"

  # shares k3s's network so the kubeconfig's https://127.0.0.1:6443 works as is,
  # and so does the apiserver's call to the webhooks on 127.0.0.1:9443
  operator:
    image: t3kton/operator:latest
    build: src/kubernetes
    profiles: [ kubernetes ]
    network_mode: service:k3s
    command: [ "--webhook-cert-path=/certs" ]
    environment:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      CONTRACTOR_HOST: http://contractor
      CONTRACTOR_USERNAME: root
      CONTRACTOR_PASSWORD: ${ROOT_PASSWORD:-root}
    volumes:
      - k3s_config:/etc/rancher/k3s:ro
      - k8s_certs:/certs:ro
    depends_on:
      - k3s
      - k8s-certs
      - contractor
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  contractor_data:
  k3s_data:
  k3s_config:
  k8s_certs:
